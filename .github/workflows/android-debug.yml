name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute for gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Setup Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5 || true
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "Missing gradlew — installing wrapper via gradle"
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubit-head-offices-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: List outputs
        run: find app/build/outputs -name "*.apk" -o -name "*.apk.idsig" 2>/dev/null || true
